<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Diario Horómetros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">

    <link rel="stylesheet" href="../css/horometros.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>Registro Diario Horómetros</header>

    <div class="card">
        <div class="fecha">
            <strong>Fecha:</strong>
            <input type="date" id="fechaInput">
        </div>

        <table id="tabla">
            <thead>
                <tr>
                    <th>EQUIPO</th>
                    <th>HORÓMETRO</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <button id="btnGuardar" onclick="guardarDatos()">Guardar en Google Sheets</button>
        <button style="background:#888; margin-top:10px;" onclick="location.href='../index.html'">Volver al
            Menú</button>
    </div>

    <script>
        // URL de la Web App de Google Sheets (Unificada para evitar errores)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby2qh617bRN5RXeJZsXou3J5f6uIpN_IKkvkS8VdZHotZiM8T4sxczwWULsPjUBdee5Iw/exec";

        const hoy = new Date();
        const yyyy = hoy.getFullYear();
        const mm = String(hoy.getMonth() + 1).padStart(2, "0");
        const dd = String(hoy.getDate()).padStart(2, "0");
        document.getElementById("fechaInput").value = `${yyyy}-${mm}-${dd}`;

        function obtenerFechaFormateada() {
            const val = document.getElementById("fechaInput").value; // yyyy-mm-dd
            if (!val) return "";
            const partes = val.split("-");
            return `${partes[2]}/${partes[1]}/${partes[0]}`; // dd/mm/yyyy
        }

        // Lista de equipos (ahora se carga dinámicamente)
        let equipos = [];

        const tbody = document.querySelector("#tabla tbody");

        // Función para cargar metadatos (Equipos)
        async function fetchMetadata() {
            // 1. Intentar cargar desde Cache (localStorage)
            const cached = localStorage.getItem("cache_equipos");
            if (cached) {
                equipos = JSON.parse(cached);
                renderTabla();
                recuperarProgreso();
                cargarPlaceholders();
            } else {
                tbody.innerHTML = `<tr><td colspan="2" style="padding:20px;">Cargando equipos...</td></tr>`;
            }

            // 2. Actualizar desde Google Sheets en segundo plano
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getMetadata`);
                const data = await res.json();

                // Guardar en cache para la próxima vez
                localStorage.setItem("cache_equipos", JSON.stringify(data.equipos || []));

                // Si los datos cambiaron o no había cache, actualizar la interfaz
                if (JSON.stringify(equipos) !== JSON.stringify(data.equipos)) {
                    equipos = data.equipos || [];
                    renderTabla();
                    recuperarProgreso(); // Volver a aplicar valores ingresados
                    cargarPlaceholders(); // Actualizar placeholders con los nuevos equipos
                }
            } catch (err) {
                console.error("Error cargando metadatos:", err);
                if (!cached) {
                    tbody.innerHTML = `<tr><td colspan="2" style="padding:20px; color:red;">Error al cargar equipos</td></tr>`;
                }
            }
        }

        // Crear filas dinámicamente
        function renderTabla() {
            tbody.innerHTML = "";
            equipos.forEach((item, index) => {
                const fila = document.createElement("tr");
                fila.innerHTML = `
                    <td>${item.equipo}</td>
                    <td>
                        <input type="number" inputmode="decimal" step="0.1" id="h${index}" placeholder="" oninput="guardarProgreso()">
                    </td>
                `;
                tbody.appendChild(fila);
            });
        }

        // Evento para guardar fecha al cambiar
        document.getElementById("fechaInput").addEventListener("change", guardarProgreso);

        // Guardar progreso en localStorage
        function guardarProgreso() {
            const temp = {
                fecha: document.getElementById("fechaInput").value,
                valores: {}
            };
            equipos.forEach((_, i) => {
                const input = document.getElementById("h" + i);
                if (input) {
                    const val = input.value;
                    if (val !== "") temp.valores[i] = val;
                }
            });
            localStorage.setItem("tmp_horometros", JSON.stringify(temp));
        }

        // Recuperar progreso
        function recuperarProgreso() {
            const data = localStorage.getItem("tmp_horometros");
            if (data) {
                const temp = JSON.parse(data);
                if (temp.fecha) document.getElementById("fechaInput").value = temp.fecha;
                for (const i in temp.valores) {
                    const input = document.getElementById("h" + i);
                    if (input) input.value = temp.valores[i];
                }
            }
        }

        // Llamar carga inicial
        document.addEventListener("DOMContentLoaded", () => {
            fetchMetadata();
        });

        // Cargar últimos valores como placeholders desde Google Sheets
        function cargarPlaceholders() {
            if (equipos.length === 0) return;

            equipos.forEach((_, i) => {
                const input = document.getElementById("h" + i);
                if (input) input.placeholder = "...";
            });

            fetch(`${WEB_APP_URL}?action=getLatest`)
                .then(res => res.json())
                .then(datos => {
                    if (datos.scriptError) {
                        console.error("Error del Script:", datos.scriptError);
                        equipos.forEach((_, i) => {
                            const input = document.getElementById("h" + i);
                            if (input) input.placeholder = "Error";
                        });
                        return;
                    }

                    equipos.forEach((item, i) => {
                        const input = document.getElementById("h" + i);
                        if (input) {
                            const valor = datos[String(item.equipo).trim()];
                            input.placeholder = (valor !== undefined && valor !== null && valor !== "") ? valor : "N/A";
                        }
                    });
                })
                .catch(err => {
                    console.error("Error de red:", err);
                    equipos.forEach((_, i) => {
                        const input = document.getElementById("h" + i);
                        if (input) input.placeholder = "Error";
                    });
                });
        }

        // Función para resetear campos
        function resetearCampos() {
            // Resetear inputs a vacío (o 0 según preferencia, aquí vacío para placeholder)
            equipos.forEach((_, i) => {
                document.getElementById("h" + i).value = "";
            });
            // Resetear fecha a hoy
            const hoy = new Date();
            const yyyy = hoy.getFullYear();
            const mm = String(hoy.getMonth() + 1).padStart(2, "0");
            const dd = String(hoy.getDate()).padStart(2, "0");
            document.getElementById("fechaInput").value = `${yyyy}-${mm}-${dd}`;
            // Limpiar localStorage
            localStorage.removeItem("tmp_horometros");
        }

        // Función guardar datos en Google Sheets
        function guardarDatos() {
            const btn = document.getElementById("btnGuardar");
            const filas = document.querySelectorAll("#tabla tbody tr");
            filas.forEach(f => f.classList.remove("error"));

            const registros = [];
            let error = false;

            const fechaSeleccionada = obtenerFechaFormateada();

            for (let i = 0; i < equipos.length; i++) {
                let valor = document.getElementById("h" + i).value.trim();
                if (valor === "") {
                    filas[i].classList.add("error");
                    error = true;
                } else {
                    valor = valor.replace(",", "."); // punto decimal
                    registros.push(`${fechaSeleccionada}|${equipos[i].equipo}|${equipos[i].ciudad}|${equipos[i].area}|${valor}`);
                }
            }

            if (error) {
                Swal.fire({
                    icon: "warning",
                    title: "Campos incompletos",
                    text: "Faltan horómetros por diligenciar.",
                    confirmButtonColor: "#27ae60"
                });
                return;
            }

            // Deshabilitar botón para evitar múltiples envíos
            btn.disabled = true;
            btn.textContent = "Guardando...";

            const formData = new URLSearchParams();
            formData.append("datos", registros.join("||"));

            fetch(WEB_APP_URL, {
                method: "POST",
                body: formData,
                mode: "cors",
                redirect: "follow"
            })
                .then(res => res.json())
                .then(d => {
                    if (d.status === "success" || d.result === "success") {
                        Swal.fire({
                            icon: "success",
                            title: "¡Guardado!",
                            text: "Datos guardados correctamente en Google Sheets.",
                            confirmButtonColor: "#27ae60"
                        }).then(() => {
                            resetearCampos();
                            cargarPlaceholders();
                        });
                    } else {
                        throw new Error(d.message || "Error desconocido");
                    }
                })
                .catch(e => {
                    Swal.fire({
                        icon: "error",
                        title: "Error al guardar",
                        text: "Error: " + e.message + ". Verifica que la Web App esté desplegada como 'Cualquiera'.",
                        confirmButtonColor: "#e74c3c"
                    });
                    console.error(e);
                })
                .finally(() => {
                    // Re-habilitar botón al terminar (éxito o error)
                    btn.disabled = false;
                    btn.textContent = "Guardar en Google Sheets";
                });
        }
    </script>

</body>

</html>
